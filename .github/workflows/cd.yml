name: VoltaSplat CD

on:
  release:
    types: [published]
  workflow_dispatch: # Allows you to manually trigger the deployment from the GitHub Actions UI

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install build tooling and CPU PyTorch
      run: |
        python -m pip install --upgrade pip build twine setuptools wheel
        python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
        
    - name: Build source distribution
      # The extension needs nvcc, which hosted runners lack, so only the sdist is built here;
      # users compile it on their own machine (`pip install voltasplat --no-build-isolation`).
      run: |
        python -m build --sdist --no-isolation
        
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        # Publishing is intentionally disabled (dry run). Enable by uncommenting the next line and adding PYPI_API_TOKEN.
        # twine upload dist/*
        twine check dist/*
