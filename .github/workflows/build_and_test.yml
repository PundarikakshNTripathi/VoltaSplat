name: VoltaSplat CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  reference-gradcheck:
    # GPU-free: float64 finite-difference check of the PyTorch reference renderer that the CUDA kernels are tested against.
    name: Reference renderer gradcheck (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest numpy
      - name: Gradcheck
        run: python -m pytest tests/test_reference_gradcheck.py -v

  cuda-build:
    # Hosted runners have no GPU: this job compiles the CUDA extension for Ampere..Blackwell inside an nvcc image and imports it.
    # The CUDA-vs-reference tests skip themselves here and are run on a GPU machine (`make test`).
    name: Compile CUDA extension (no GPU)
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-dev python3-pip build-essential ninja-build git
      - name: Install PyTorch (CUDA 12.8 wheels) and test dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install torch --index-url https://download.pytorch.org/whl/cu128
          python3 -m pip install pytest numpy matplotlib ninja
      - name: Build the extension
        env:
          TORCH_CUDA_ARCH_LIST: "8.0;8.6;8.9;9.0;12.0"
        run: python3 -m pip install -e . --no-build-isolation
      - name: Import check and test run (GPU tests skip without a device)
        run: |
          python3 -c "import voltasplat._C as c; print('loaded', c.__file__)"
          python3 -m pytest tests -v
